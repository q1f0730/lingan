<script>
    document.addEventListener('DOMContentLoaded', () => {
        const rows = document.querySelectorAll('.project-row');
        const imgContainer = document.getElementById('hover-image-container');
        const img = document.getElementById('hover-image');

        rows.forEach(row => {
            row.addEventListener('mouseenter', () => {
                img.src = row.dataset.image;
                imgContainer.classList.remove('hidden');
                // Allow a small delay before fading in to ensure src is set and browser is ready to render
                setTimeout(() => {
                    imgContainer.classList.remove('opacity-0');
                    imgContainer.classList.add('opacity-100');
                }, 10);
            });

            row.addEventListener('mousemove', (e) => {
                // Offset slightly so cursor doesn't cover image center
                imgContainer.style.left = (e.clientX + 140) + 'px';
                imgContainer.style.top = e.clientY + 'px';
            });

            row.addEventListener('mouseleave', () => {
                imgContainer.classList.remove('opacity-100');
                imgContainer.classList.add('opacity-0');
                // Wait for transition before hiding
                setTimeout(() => {
                    if (imgContainer.classList.contains('opacity-0')) {
                        imgContainer.classList.add('hidden');
                    }
                }, 300);
            });
        });
    });
</script>
