<!DOCTYPE html>

    }
    body {
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Inter', 'Noto Sans SC', sans-serif;

      padding: 0;

            想法 · 10/17

      <div class="mt-16 text-center text-[12px] text-secondary tracking-wider">

    <footer class="fixed bottom-0 w-[390px] bg-[#FFFFFF] z-50">

        <span class="text-[13px] text-secondary select-none">

        <button type="button" class="text-[13px] font-semibold text-primary bg-transparent border-0 p-0 m-0 hover:opacity-60 transition-none cursor-pointer">
