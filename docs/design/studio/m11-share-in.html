<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>拾穗 · GLEAN — 拾一穗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans SC', 'sans-serif'],
          },
          colors: {
            surface: '#FFFFFF',
            primary: '#000000',
            outline: '#7E7E7E',
            'outline-light': '#C6C6C6',
            line: '#000000',
            'line-light': '#E5E5E5',
          }
        }
      }
    }
  </script>
  <style>
    * {
      border-radius: 0px !important;
      box-shadow: none !important;
      -webkit-font-smoothing: antialiased;
    }
    body {
      background-color: #F0F0F0;
      color: #000000;
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      margin: 0;
      padding: 0;
    }
    input, button, textarea {
      font-family: inherit;
    }
  </style>
<style id="glean-fix">/* Q1f730 · STYLE.md: Inter + Noto Sans SC only, 0 radius */ .font-mono,[class*="mono"],code,kbd,samp{font-family:"Inter","Noto Sans SC","PingFang SC",sans-serif!important;font-variant-numeric:tabular-nums}</style>
</head>
<body class="flex justify-center min-h-screen">
  <!-- 390px Mobile Canvas Container -->
  <main class="w-[390px] min-h-screen bg-white flex flex-col justify-between relative shadow-none border-0 box-border">
    
    <div>
      <!-- Top Bar: Origin App & Action -->
      <header class="w-full px-4 pt-5 pb-2 flex items-center justify-between">
        <span class="text-[12px] text-outline font-normal leading-none tracking-normal">来自 网易云音乐</span>
        <button type="button" class="text-[12px] text-primary font-normal leading-none cursor-pointer bg-transparent p-0 border-0">取消</button>
      </header>

      <!-- Headline: Display 56px -->
      <section class="px-4 pt-2 pb-4">
        <h1 class="text-[56px] font-semibold text-primary tracking-[-0.04em] leading-[1.0] m-0">
          拾一穗
        </h1>
      </section>

      <!-- Full-bleed 1:1 Photo (snowy Icelandic coast with red-roofed house) -->
      <section class="w-full aspect-square bg-[#E8E8E8] relative overflow-hidden">
        <img 
          src="https://lh3.googleusercontent.com/aida/AEtjO1UKjZjlNqWjB96fmYth3qCsZhPaaxo9fIJ5LWK8lL_UYzFMikBUdgwUdYumwM0dIQUtR-2ctz7Tmv5e0F7FbJaxYTtqYt2YOh89NpF2ltT5IIdH0h3M9_MSCGF8K6tnwQhNbXf9VqzlT6Gc-wv_OBIhT_yZl4Jv4EKJS98FX0wviWjhCHVdaoecw2a3jWLnCeCASTSMPJCqPVNrT7pJoQ4NhWoiHIvJeOChqJLG1R62DEVOnifaqxhWDg" 
          alt="雪地红屋与海岸" 
          class="w-full h-full object-cover object-center block"
        />
      </section>

      <!-- Underline Form Section -->
      <section class="px-4 pt-6 pb-2 space-y-5">
        
        <!-- Type Selection Row -->
        <div class="space-y-1.5">
          <label class="block text-[11px] text-outline font-normal leading-none">类型</label>
          <div class="flex items-center gap-4 text-[13px] leading-none pt-1">
            <span class="text-outline cursor-pointer">照片</span>
            <span class="text-primary font-medium border-b border-primary pb-0.5 cursor-pointer">歌</span>
            <span class="text-outline cursor-pointer">电影</span>
            <span class="text-outline cursor-pointer">摘抄</span>
            <span class="text-outline cursor-pointer">想法</span>
            <span class="text-outline cursor-pointer">链接</span>
          </div>
        </div>

        <!-- Title -->
        <div class="space-y-1">
          <label class="block text-[11px] text-outline font-normal leading-none">标题</label>
          <div class="border-b border-primary pb-1 pt-0.5">
            <input 
              type="text" 
              value="Hoppípolla" 
              class="w-full p-0 text-[15px] font-medium text-primary bg-transparent border-0 focus:outline-none focus:ring-0 leading-normal"
            />
          </div>
        </div>

        <!-- Author / Artist -->
        <div class="space-y-1">
          <label class="block text-[11px] text-outline font-normal leading-none">作者</label>
          <div class="border-b border-primary pb-1 pt-0.5">
            <input 
              type="text" 
              value="Sigur Rós" 
              class="w-full p-0 text-[15px] font-medium text-primary bg-transparent border-0 focus:outline-none focus:ring-0 leading-normal"
            />
          </div>
        </div>

        <!-- Year -->
        <div class="space-y-1">
          <label class="block text-[11px] text-outline font-normal leading-none">年份</label>
          <div class="border-b border-primary pb-1 pt-0.5">
            <input 
              type="text" 
              value="2005" 
              class="w-full p-0 text-[15px] font-normal text-primary bg-transparent border-0 focus:outline-none focus:ring-0 leading-normal"
            />
          </div>
        </div>

        <!-- Link -->
        <div class="space-y-1">
          <label class="block text-[11px] text-outline font-normal leading-none">链接</label>
          <div class="border-b border-primary pb-1 pt-0.5">
            <input 
              type="text" 
              readonly 
              value="music.163.com/song?id=…" 
              class="w-full p-0 text-[13px] font-normal text-outline bg-transparent border-0 focus:outline-none focus:ring-0 leading-normal truncate"
            />
          </div>
        </div>

        <!-- Tags -->
        <div class="space-y-1">
          <label class="block text-[11px] text-outline font-normal leading-none">标签</label>
          <div class="border-b border-primary pb-1 pt-0.5 flex items-center justify-between">
            <div class="flex items-center gap-3 text-[13px] text-primary font-normal">
              <span>#声音</span>
              <span>#清晨</span>
            </div>
            <button type="button" class="text-[12px] text-outline cursor-pointer bg-transparent p-0 border-0 font-normal">
              + 加标签
            </button>
          </div>
        </div>

        <!-- Why Collected (为什么收) -->
        <div class="space-y-1">
          <label class="block text-[11px] text-outline font-normal leading-none">为什么收</label>
          <div class="border-b border-primary pb-1 pt-0.5">
            <textarea 
              rows="1" 
              class="w-full p-0 text-[14px] text-primary bg-transparent border-0 focus:outline-none focus:ring-0 resize-none leading-relaxed font-normal"
            >早上骑车下坡时，正好放到副歌。</textarea>
          </div>
        </div>

        <!-- Automatic parsing note -->
        <div class="pt-1">
          <p class="text-[11px] text-outline font-normal leading-tight m-0">
            自动识别了标题和作者，可以改。
          </p>
        </div>

      </section>
    </div>

    <!-- Bottom Action & System Footer (No bottom nav, no quick-capture bar) -->
    <div class="px-4 pb-8 pt-6">
      <button 
        type="button" 
        class="w-full h-12 bg-primary text-white text-[14px] font-medium flex items-center justify-center cursor-pointer border-0 active:opacity-80 transition-none"
      >
        拾进穗仓（第 11 穗）
      </button>

      <footer class="mt-6 text-center">
        <span class="text-[11px] text-outline font-normal select-none">
          © 2026 Q1f730
        </span>
      </footer>
    </div>

  </main>
</body>
</html>
