<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>拾穗 · GLEAN — 新枝 (5)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          pure: '#000000',
          greyMeta: '#7E7E7E',
          greyInactive: '#C6C6C6',
          greyBorder: '#E5E5E5',
          faint: '#F7F7F7',
        },
        fontFamily: {
          sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
        }
      }
    }
  }
</script>
<style>
  * {
    border-radius: 0 !important;
    box-shadow: none !important;
    text-shadow: none !important;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    background-color: #FAFAFA;
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
  }
  .display-title {
    font-size: 56px;
    font-weight: 600;
    line-height: 1.0;
    letter-spacing: -0.04em;
  }
</style>
<style id="glean-fix">/* Q1f730 · STYLE.md: Inter + Noto Sans SC only, 0 radius */ .font-mono,[class*="mono"],code,kbd,samp{font-family:"Inter","Noto Sans SC","PingFang SC",sans-serif!important;font-variant-numeric:tabular-nums}</style>
</head>
<body class="min-h-screen flex justify-center text-pure selection:bg-pure selection:text-white">
  <!-- 390px Mobile Canvas Container -->
  <div class="w-[390px] min-h-screen bg-white relative flex flex-col justify-between pb-[114px]">
    
    <!-- Top Bar -->
    <header class="w-full px-4 pt-4 pb-2 flex justify-between items-baseline select-none">
      <div class="text-[20px] font-semibold tracking-tight text-pure">
        拾穗 · GLEAN
      </div>
      <button type="button" class="text-[12px] text-greyMeta hover:text-pure active:opacity-60 transition-none p-0 bg-transparent border-0 tracking-wide cursor-pointer">
        设置
      </button>
    </header>

    <!-- Main Content Flow -->
    <main class="w-full px-4 pt-6 flex-1">
      <!-- Huge Headline -->
      <h1 class="display-title text-pure mb-10 select-none">
        新枝 (5)
      </h1>

      <!-- BATCH BUNDLE 1: 10/22 · 远距 · 3 根 -->
      <section class="mb-12">
        <!-- Label row -->
        <div class="flex justify-between items-baseline text-[12px] text-greyMeta pb-1.5 tracking-tight select-none">
          <span>10/22 · 远距 · 3 根</span>
          <span>来自 6 穗</span>
        </div>
        <!-- 1px black rule -->
        <div class="w-full h-[1px] bg-pure mb-5"></div>

        <!-- Rows in Bundle 1 -->
        <div class="space-y-6">
          <!-- Item 01 -->
          <article class="flex items-start">
            <span class="w-8 shrink-0 text-[24px] font-light leading-none tracking-tighter text-pure select-none font-['Inter']">
              01
            </span>
            <div class="flex-1 min-w-0 pt-0.5">
              <div class="flex items-center gap-2 flex-wrap">
                <h2 class="text-[18px] font-semibold text-pure leading-snug tracking-tight">
                  楼道电台
                </h2>
                <span class="inline-block px-1 py-[1px] text-[10px] font-medium bg-pure text-white leading-none tracking-wide select-none">
                  证据不足
                </span>
              </div>
              <p class="text-[12px] text-greyMeta mt-1 leading-normal tracking-tight">
                声控灯起名 / Radio Garden / Re: Stacks
              </p>
            </div>
          </article>

          <!-- Item 02 -->
          <article class="flex items-start">
            <span class="w-8 shrink-0 text-[24px] font-light leading-none tracking-tighter text-pure select-none font-['Inter']">
              02
            </span>
            <div class="flex-1 min-w-0 pt-0.5">
              <h2 class="text-[18px] font-semibold text-pure leading-snug tracking-tight">
                渡轮上的平山
              </h2>
              <p class="text-[12px] text-greyMeta mt-1 leading-normal tracking-tight">
                轮渡上的雾 / 完美的日子 / 《一一》
              </p>
            </div>
          </article>

          <!-- Item 03 -->
          <article class="flex items-start">
            <span class="w-8 shrink-0 text-[24px] font-light leading-none tracking-tighter text-pure select-none font-['Inter']">
              03
            </span>
            <div class="flex-1 min-w-0 pt-0.5">
              <h2 class="text-[18px] font-semibold text-pure leading-snug tracking-tight">
                说出来就消失的书店
              </h2>
              <p class="text-[12px] text-greyMeta mt-1 leading-normal tracking-tight">
                卡尔维诺 / 旧书店的书脊 / aqua
              </p>
            </div>
          </article>
        </div>
      </section>

      <!-- BATCH BUNDLE 2: 10/15 · 跨媒介 · 2 根 -->
      <section class="mb-10">
        <!-- Label row -->
        <div class="flex justify-between items-baseline text-[12px] text-greyMeta pb-1.5 tracking-tight select-none">
          <span>10/15 · 跨媒介 · 2 根</span>
          <span>来自 4 穗</span>
        </div>
        <!-- 1px black rule -->
        <div class="w-full h-[1px] bg-pure mb-5"></div>

        <!-- Rows in Bundle 2 -->
        <div class="space-y-6">
          <!-- Item 01 -->
          <article class="flex items-start">
            <span class="w-8 shrink-0 text-[24px] font-light leading-none tracking-tighter text-pure select-none font-['Inter']">
              01
            </span>
            <div class="flex-1 min-w-0 pt-0.5">
              <h2 class="text-[18px] font-semibold text-pure leading-snug tracking-tight">
                小票诗选 · 夜班卷
              </h2>
              <p class="text-[12px] text-greyMeta mt-1 leading-normal tracking-tight">
                外卖小票上的备注 / 《一一》 / 旧书店的书脊
              </p>
            </div>
          </article>

          <!-- Item 02 -->
          <article class="flex items-start">
            <span class="w-8 shrink-0 text-[24px] font-light leading-none tracking-tighter text-pure select-none font-['Inter']">
              02
            </span>
            <div class="flex-1 min-w-0 pt-0.5">
              <h2 class="text-[18px] font-semibold text-pure leading-snug tracking-tight">
                给书脊配一首歌
              </h2>
              <p class="text-[12px] text-greyMeta mt-1 leading-normal tracking-tight">
                旧书店的书脊 / aqua
              </p>
            </div>
          </article>
        </div>

        <!-- Subtext & Button for Discarded Items -->
        <div class="mt-8 pt-2 flex items-baseline justify-between select-none">
          <span class="text-[12px] text-greyMeta tracking-tight">
            10/15 那次还有 1 根你没要。
          </span>
          <button type="button" class="text-[12px] text-greyMeta hover:text-pure underline underline-offset-2 transition-none cursor-pointer p-0 bg-transparent border-0 tracking-tight">
            看不要的
          </button>
        </div>
      </section>

      <!-- Footer copyright -->
      <footer class="mt-14 pb-4 text-center select-none">
        <p class="text-[11px] text-greyInactive font-['Inter'] tracking-widest uppercase">
          © 2026 Q1f730
        </p>
      </footer>
    </main>

    <!-- Pinned Bottom Controls (Fixed to bottom of 390px mobile view) -->
    <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-[390px] bg-white z-50">
      
      <!-- Quick-capture line -->
      <div class="w-full border-t border-pure px-4 py-3 flex items-center justify-between">
        <input 
          type="text" 
          placeholder="随手拾一穗" 
          class="w-full text-[13px] text-pure placeholder:text-greyMeta bg-transparent border-0 p-0 focus:outline-none focus:ring-0 tracking-tight"
        />
        <button 
          type="button" 
          class="shrink-0 ml-3 py-1 text-black text-[13px] font-semibold leading-none tracking-wider cursor-pointer active:opacity-70 transition-none"
        >
          拾
        </button>
      </div>

      <!-- Five-word text navigation bar -->
      <nav class="w-full border-t border-greyBorder px-4 py-3.5 flex justify-between items-center text-[12px] select-none">
        <button type="button" class="text-greyMeta hover:text-pure transition-none p-0 bg-transparent border-0 tracking-wider">
          穗仓
        </button>
        <button type="button" class="text-greyMeta hover:text-pure transition-none p-0 bg-transparent border-0 tracking-wider">
          嫁接
        </button>
        <!-- Active Tab: 新枝 (Black with 1px underline) -->
        <button type="button" class="text-pure font-medium border-b border-pure pb-[1px] transition-none p-0 bg-transparent tracking-wider">
          新枝
        </button>
        <button type="button" class="text-greyMeta hover:text-pure transition-none p-0 bg-transparent border-0 tracking-wider">
          口味
        </button>
        <button type="button" class="text-greyMeta hover:text-pure transition-none p-0 bg-transparent border-0 tracking-wider">
          设置
        </button>
      </nav>

    </div>

  </div>
</body>
</html>
