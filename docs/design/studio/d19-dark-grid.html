<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>拾穗 · GLEAN — 桌面端穗仓网格视图 (Dark Theme 1440px)</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    border-radius: 0 !important;
  }
  body {
    background-color: #000000;
    color: #FFFFFF;
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* TOP NAV */
  header.nav-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background-color: #000000;
    height: 72px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand-logo {
    font-size: 20px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: -0.02em;
    text-decoration: none;
  }
  nav.center-nav {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .nav-item {
    font-size: 13px;
    font-weight: 500;
    color: #8E8E8E;
    text-decoration: none;
    letter-spacing: 0.04em;
    padding-bottom: 4px;
    transition: color 0.15s ease;
  }
  .nav-item:hover {
    color: #FFFFFF;
  }
  .nav-item.active {
    color: #FFFFFF;
    border-bottom: 1px solid #FFFFFF;
  }
  .quick-capture-box {
    width: 320px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #FFFFFF;
    padding-bottom: 6px;
  }
  .quick-capture-input {
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Inter', 'Noto Sans SC', sans-serif;
    font-size: 13px;
    color: #FFFFFF;
    width: 100%;
    letter-spacing: 0.02em;
  }
  .quick-capture-input::placeholder {
    color: #8E8E8E;
  }
  .quick-capture-arrow {
    font-size: 13px;
    color: #8E8E8E;
    user-select: none;
    margin-left: 6px;
  }

  /* MAIN WRAPPER */
  main.main-content {
    padding: 0 40px;
    max-width: 1440px;
    margin: 0 auto;
  }

  /* HEADLINE ROW */
  .headline-section {
    margin-top: 140px;
    margin-bottom: 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .main-headline {
    font-size: 108px;
    font-weight: 600;
    line-height: 1.0;
    letter-spacing: -0.04em;
    color: #FFFFFF;
  }
  .view-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding-bottom: 12px;
  }
  .view-toggle .active {
    color: #FFFFFF;
    text-decoration: none;
  }
  .view-toggle .divider {
    color: rgba(255, 255, 255, 0.2);
  }
  .view-toggle .inactive {
    color: #8E8E8E;
    text-decoration: none;
    transition: color 0.15s ease;
  }
  .view-toggle .inactive:hover {
    color: #FFFFFF;
  }

  /* 3-COLUMN GRID */
  .grain-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 140px;
  }

  /* 4:5 TILE */
  .tile {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    background-color: #1B1B1B;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* PHOTO TILE */
  .tile-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
  }
  .photo-caption {
    position: absolute;
    bottom: 24px;
    left: 24px;
    right: 24px;
    z-index: 2;
    color: #FFFFFF;
  }
  .photo-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    color: #FFFFFF;
  }
  .photo-meta {
    font-size: 12px;
    font-weight: 400;
    color: #8E8E8E;
    letter-spacing: 0.02em;
  }

  /* TEXT TILE */
  .tile-text {
    padding: 36px 32px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }
  .tile-body-quote {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.48;
    color: #FFFFFF;
    letter-spacing: -0.015em;
  }
  .tile-body-thought {
    font-size: 24px;
    font-weight: 500;
    line-height: 1.45;
    color: #FFFFFF;
    letter-spacing: -0.015em;
  }
  .tile-body-link-title {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.4;
    color: #FFFFFF;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .tile-body-link-url {
    font-size: 13px;
    font-weight: 400;
    color: #8E8E8E;
    text-decoration: underline;
    text-underline-offset: 3px;
    word-break: break-all;
  }
  .tile-footer {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  .tile-source {
    font-size: 12px;
    font-weight: 400;
    color: #8E8E8E;
    letter-spacing: 0.02em;
  }
  .tile-meta-line {
    font-size: 12px;
    font-weight: 400;
    color: #8E8E8E;
    letter-spacing: 0.02em;
  }

  /* FOOTER */
  footer.page-footer {
    padding: 0 40px 60px;
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    justify-content: flex-start;
  }
  .footer-copyright {
    font-size: 10px;
    color: #8E8E8E;
    letter-spacing: 0.1em;
    font-weight: 400;
  }
</style>
</head>
<body>

      <!-- ROW 3, COL 2: aqua -->

      <!-- ROW 3, COL 3: 《一一》 -->

        <div class="photo-scrim"></div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="page-footer">

</html>
