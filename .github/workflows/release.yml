name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag, e.g. v0.1.0'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  # v0.25 0712：质量门前置，全绿才建 release
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
      - run: node scripts/size-budget.mjs --report size-report.md
      - run: node --check mcp/glean-mcp.mjs
      - uses: actions/upload-artifact@v4
        with: { name: size-report, path: size-report.md }
  create-release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: notes
        run: |
          V="${TAG#v}"
          if [ -f "docs/releases/$TAG.md" ]; then cp "docs/releases/$TAG.md" notes.md; else echo "拾穗 Glean $TAG" > notes.md; fi
      - id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 拾穗 Glean ${{ env.TAG }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          make_latest: true
  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - name: set version
        shell: bash
        run: node scripts/set-version.mjs "${TAG#v}"
      - run: npm ci
      - run: npm test
      # v0.25 0511 自动更新：安装包用 updater 私钥签名（私钥只在 Secrets），tauri-action 上传 .sig 与 latest.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          assetNamePattern: 'Glean_[version]_[arch][setup][ext]'
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - name: set version
        run: node scripts/set-version.mjs "${TAG#v}"
      - run: npm ci
      - name: android init + build
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android init --ci
          npx tauri icon public/favicon.svg
          node scripts/patch-android.mjs
          npx tauri android build --apk --ci --target aarch64 armv7
      - name: sign (v3 key rotation, key from secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::missing ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "apk: $IN"
          KS="$RUNNER_TEMP/glean.p12"
          echo "$KS_B64" | base64 -d > "$KS"
          $BT/zipalign -f -p 4 "$IN" aligned.apk
          # 新密钥 + 轮换证明（旧 lingan.p12 → glean2026）；minSdk 28，只出 v3 签名，CI 不再需要旧密钥
          $BT/apksigner sign --ks "$KS" --ks-type PKCS12 --ks-key-alias glean2026 --ks-pass env:KS_PASS \
            --lineage signing/glean.lineage --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --min-sdk-version 28 \
            --out "Glean_${TAG#v}_android.apk" aligned.apk
          rm -f "$KS"
          $BT/apksigner verify --print-certs -v "Glean_${TAG#v}_android.apk" | grep -E "Verifies|v3 scheme|certificate (DN|SHA-256 digest)"
          # 新版 apksigner 对带 SDK 范围的 v3 签名打印 "Signer (minSdkVersion=…) certificate …"，不一定是 "Signer #1"
          FP=$($BT/apksigner verify --print-certs "Glean_${TAG#v}_android.apk" | grep -E 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          if [ "$FP" != "9771c62b20a081c6c3d17d0928f2314f969105f1cfaa8cc1ab6bfee4cfb36d88" ]; then echo "::error::unexpected signer $FP"; exit 1; fi
          $BT/apksigner lineage --in "Glean_${TAG#v}_android.apk" --print-certs | grep -E "Signer #. in lineage certificate SHA-256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: Glean_*_android.apk
  # v0.25：产物核对（apk / exe / msi / latest.json / .sig 必须都在）+ 0748 SHA256SUMS + glean-mcp.mjs
  finalize:
    needs: [create-release, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check assets + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${TAG#v}"
          sed "s/^const VERSION = '.*';/const VERSION = '$V';/" mcp/glean-mcp.mjs > glean-mcp.mjs
          gh release upload "$TAG" glean-mcp.mjs --clobber -R "$GITHUB_REPOSITORY"
          mkdir -p a && cd a
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*'
          ls -la
          for p in "Glean_${V}_android.apk" "latest.json" "glean-mcp.mjs"; do [ -f "$p" ] || { echo "::error::missing $p"; exit 1; }; done
          ls *setup.exe >/dev/null && ls *.msi >/dev/null && ls *setup.exe.sig >/dev/null || { echo "::error::missing exe / msi / updater signature"; exit 1; }
          grep -q "\"version\": *\"$V\"" latest.json || { echo "::error::latest.json version mismatch"; cat latest.json; exit 1; }
          grep -q 'windows-x86_64' latest.json || { echo "::error::latest.json has no windows platform"; exit 1; }
          rm -f SHA256SUMS.txt
          sha256sum $(ls | grep -v '^SHA256SUMS') > ../SHA256SUMS.txt
          cd .. && cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
