name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag, e.g. v0.1.0'
        required: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true
env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
jobs:
  # v0.25 0712：质量门前置，全绿才建 release
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx vite build
      - run: node scripts/size-budget.mjs --report size-report.md
      - run: node --check mcp/glean-mcp.mjs
      - uses: actions/upload-artifact@v4
        with: { name: size-report, path: size-report.md }
      # v0.37 0705：e2e 进发版质量门（ALL PASS 才往下走）。性能组只在 InstaBox 上当门（runner 之间差太多），这里跳过
      - name: e2e
        env: { E2E_CHROMIUM: /usr/bin/google-chrome, E2E_SKIP: perf, E2E_TRACE: '1' }
        run: |
          npm i --no-save playwright-core@1.64.1
          (npx vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node e2e/run.mjs http://127.0.0.1:4173/ e2e-out 2>&1 | tee e2e.log
          tail -1 e2e.log | grep -qx 'ALL PASS'
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-failure, path: 'e2e-out/trace-*.zip', if-no-files-found: ignore }
  create-release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      # v0.37 0728：先建草稿，产物齐了、核过了（finalize）才公开；同 tag 重跑时先清掉上次留下的草稿（只删草稿）
      - name: drop stale drafts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" -q ".[] | select(.draft and .tag_name==\"$TAG\") | .id" | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
      - name: notes
        run: |
          V="${TAG#v}"
          if [ -f "docs/releases/$TAG.md" ]; then cp "docs/releases/$TAG.md" notes.md; else echo "拾穗 Glean $TAG" > notes.md; fi
      - id: rel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 拾穗 Glean ${{ env.TAG }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          draft: true
  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - name: set version
        shell: bash
        run: node scripts/set-version.mjs "${TAG#v}"
      - run: npm ci
      - run: npm test
      # v0.25 0511 自动更新：安装包用 updater 私钥签名（私钥只在 Secrets），tauri-action 上传 .sig 与 latest.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          assetNamePattern: 'Glean_[version]_[arch][setup][ext]'
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with: { workspaces: 'src-tauri -> target' }
      - name: set version
        run: node scripts/set-version.mjs "${TAG#v}"
      - run: npm ci
      - name: android init + build
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android init --ci
          npx tauri icon public/favicon.svg
          node scripts/patch-android.mjs
          npx tauri android build --apk --ci --target aarch64 armv7
      - name: sign (v3 key rotation, key from secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::missing ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          IN=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          echo "apk: $IN"
          KS="$RUNNER_TEMP/glean.p12"
          echo "$KS_B64" | base64 -d > "$KS"
          $BT/zipalign -f -p 4 "$IN" aligned.apk
          # 新密钥 + 轮换证明（旧 lingan.p12 → glean2026）；minSdk 28，只出 v3 签名，CI 不再需要旧密钥
          $BT/apksigner sign --ks "$KS" --ks-type PKCS12 --ks-key-alias glean2026 --ks-pass env:KS_PASS \
            --lineage signing/glean.lineage --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --min-sdk-version 28 \
            --out "Glean_${TAG#v}_android.apk" aligned.apk
          rm -f "$KS"
          $BT/apksigner verify --print-certs -v "Glean_${TAG#v}_android.apk" | grep -E "Verifies|v3 scheme|certificate (DN|SHA-256 digest)"
          # 新版 apksigner 对带 SDK 范围的 v3 签名打印 "Signer (minSdkVersion=…) certificate …"，不一定是 "Signer #1"
          FP=$($BT/apksigner verify --print-certs "Glean_${TAG#v}_android.apk" | grep -E 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          if [ "$FP" != "9771c62b20a081c6c3d17d0928f2314f969105f1cfaa8cc1ab6bfee4cfb36d88" ]; then echo "::error::unexpected signer $FP"; exit 1; fi
          $BT/apksigner lineage --in "Glean_${TAG#v}_android.apk" --print-certs | grep -E "Signer #. in lineage certificate SHA-256"
      - name: upload apk (draft release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" Glean_*_android.apk --clobber -R "$GITHUB_REPOSITORY"
  # v0.25：产物核对（apk / exe / msi / latest.json / .sig 必须都在）+ 0748 SHA256SUMS + glean-mcp.mjs
  finalize:
    needs: [create-release, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check assets + checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          V="${TAG#v}"
          sed "s/^const VERSION = '.*';/const VERSION = '$V';/" mcp/glean-mcp.mjs > glean-mcp.mjs
          gh release upload "$TAG" glean-mcp.mjs --clobber -R "$GITHUB_REPOSITORY"
          # v0.36 0008 / 0009：浏览器扩展（Chrome / Edge 加载已解压）打成 zip，版本号跟着 tag
          jq --arg v "$V" '.version=$v' extension/manifest.json > /tmp/manifest.json && cp /tmp/manifest.json extension/manifest.json
          (cd extension && zip -qr ../glean-extension.zip . -x 'lib.d.ts')
          unzip -l glean-extension.zip | grep -q 'manifest.json' || { echo "::error::extension zip broken"; exit 1; }
          gh release upload "$TAG" glean-extension.zip --clobber -R "$GITHUB_REPOSITORY"
          mkdir -p a && cd a
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --pattern '*'
          ls -la
          for p in "Glean_${V}_android.apk" "latest.json" "glean-mcp.mjs" "glean-extension.zip"; do [ -f "$p" ] || { echo "::error::missing $p"; exit 1; }; done
          ls *setup.exe >/dev/null && ls *.msi >/dev/null && ls *setup.exe.sig >/dev/null || { echo "::error::missing exe / msi / updater signature"; exit 1; }
          grep -q "\"version\": *\"$V\"" latest.json || { echo "::error::latest.json version mismatch"; cat latest.json; exit 1; }
          grep -q 'windows-x86_64' latest.json || { echo "::error::latest.json has no windows platform"; exit 1; }
          # v0.26 0750：latest.json 的 notes 填上这版的中文更新说明（App 里「这版新了什么」），再传回去覆盖
          node ../scripts/latest-notes.mjs "../docs/releases/$TAG.md" latest.json
          grep -q "\"version\": *\"$V\"" latest.json && grep -q 'windows-x86_64' latest.json || { echo "::error::latest.json broken after notes"; exit 1; }
          gh release upload "$TAG" latest.json --clobber -R "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS.txt
          sha256sum $(ls | grep -v '^SHA256SUMS') > ../SHA256SUMS.txt
          cd .. && cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
          # v0.37 0728：全部核过了才公开（这时才打 tag、才成为 latest，老版本的自动更新这一刻才看得到）
          gh release edit "$TAG" --draft=false --latest -R "$GITHUB_REPOSITORY"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,tagName -q '.isDraft' | grep -qx false || { echo "::error::release still draft"; exit 1; }
