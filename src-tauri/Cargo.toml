[package]
name = "lingan"
version = "0.41.0"
description = "Glean (拾穗) — a personal inspiration gleaner"
authors = ["Q1f730"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lingan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
# v0.36 0519：手机和电脑统一的系统通知（嫁接在后台完成、截图收好了）
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# v0.20：AI 密钥存系统钥匙串（Windows 凭据管理器）；安卓走 MainActivity 里的 Android Keystore 桥
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
# v0.25：本地 API / MCP（只听 127.0.0.1）+ 自动更新
tiny_http = "0.12"
getrandom = "0.3"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# v0.26 0609：自己选的自动备份文件夹（对话框放行的 fs 权限）重启后还在
tauri-plugin-persisted-scope = "2"
# v0.32 局域网直连：请求签名用 HMAC-SHA256（手写 HMAC，只引 sha2）
sha2 = "0.10"
# v0.33 系统入口：单实例（深链接转给已在运行的那个）、glean:// 深链接、开机静默启动、外链交给系统、剪贴板图转 PNG
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
png = "0.18"

# v0.22：Windows「正在播放一键拾」读系统媒体传输控件（SMTC）；v0.36 0020 系统 OCR（Media_Ocr / Graphics_Imaging）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Media_Control", "Storage_Streams", "Foundation", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Media_Ocr", "Globalization", "Graphics_Imaging", "Foundation_Collections"] }
