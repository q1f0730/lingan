[package]
name = "lingan"
version = "0.1.0"
description = "Glean (拾穗) — a personal inspiration gleaner"
authors = ["Q1f730"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lingan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
# v0.20：AI 密钥存系统钥匙串（Windows 凭据管理器）；安卓走 MainActivity 里的 Android Keystore 桥
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
